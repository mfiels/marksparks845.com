<!doctype html>
<!-- Favicon source, rendered to tools/icons/ at 512px by tools/render_images.js.
     ?square renders full-bleed for the Apple touch icon (iOS rounds the corners itself). -->
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: transparent; }
  .icon {
    width: 512px; height: 512px; border-radius: 112px;
    display: grid; place-items: center;
    background: #141414; color: #f6f5f1;
    font: 760 280px/1 "Inter", sans-serif; letter-spacing: -0.06em;
    -webkit-font-smoothing: antialiased;
  }
  .square .icon { border-radius: 0; }
  .icon span { transform: translateX(-0.03em); }
</style>
<body><div class="icon"><span>MS</span></div>
<script>if (location.search.includes("square")) document.body.className = "square";</script>
</body>
