<script>
  // Horizontal ink extents of an element's rendered text. The page gives the text's position
  // and advance width; canvas gives the side bearings (blank space inside the first and last
  // glyphs) so the result covers only painted pixels, excluding the trailing letter-spacing.
  function ink(el) {
    const cs = getComputedStyle(el), ls = parseFloat(cs.letterSpacing) || 0;
    const r = document.createRange(); r.selectNodeContents(el);
    const b = r.getBoundingClientRect(), x0 = b.left - el.getBoundingClientRect().left;
    const c = document.createElement("canvas").getContext("2d");
    c.font = `${cs.fontWeight} ${cs.fontSize} Inter`; c.letterSpacing = cs.letterSpacing;
    const m = c.measureText(el.textContent.toUpperCase());
    const bearL = -m.actualBoundingBoxLeft, bearR = (m.width - ls) - m.actualBoundingBoxRight;
    return { left: x0 + bearL, right: x0 + b.width - ls - bearR };
  }
  function placeCentered(el, top) {
    const i = ink(el);
    el.style.left = (600 - (i.left + i.right) / 2) + "px";
    el.style.top = top + "px";
    return i.right - i.left;
  }
  document.fonts.ready.then(() => {
    const W = 1200, H = 630, GAP_EYE = 34, GAP_MARK = 34, GAP = 26, RULE_H = 7;
    const name = document.getElementById("name"), trades = document.getElementById("trades");
    // Scale the trades line so its ink is exactly as wide as the name's.
    trades.style.fontSize = "30px";
    const nameW = ink(name).right - ink(name).left;
    const t30 = ink(trades).right - ink(trades).left;
    trades.style.fontSize = (30 * nameW / t30) + "px";
    const t1 = ink(trades).right - ink(trades).left;
    trades.style.fontSize = (parseFloat(trades.style.fontSize) * nameW / t1) + "px";
    // Vertical: stack by line boxes, then center the whole block.
    // The mark matches the name's ink width, like the hero and the Google logo.
    const mark = document.getElementById("mark"), hM = nameW * 141.64 / 378.88;
    const hE = document.getElementById("eyebrow").offsetHeight, hN = name.offsetHeight, hT = trades.offsetHeight;
    const total = hE + GAP_EYE + hM + GAP_MARK + hN + GAP + RULE_H + GAP + hT;
    let y = (H - total) / 2;
    placeCentered(document.getElementById("eyebrow"), y); y += hE + GAP_EYE;
    Object.assign(mark.style, { left: (W - nameW) / 2 + "px", top: y + "px", width: nameW + "px", height: hM + "px" });
    y += hM + GAP_MARK;
    placeCentered(name, y); y += hN + GAP;
    const rule = document.getElementById("rule");
    rule.style.left = (W - nameW) / 2 + "px"; rule.style.width = nameW + "px"; rule.style.top = y + "px"; y += RULE_H + GAP;
    placeCentered(trades, y);
    document.body.dataset.ready = "1";
  });
</script>
